<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Task Board</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <nav class="navbar">
            <img src="cloudus_infotech_logo.png" alt="cloudus_infotech_logo">
               <div class="nav-link">
                <a href="/home">Home</a>
                <a href="/about">About</a>
                <a href="form.html">Tasks</a>
                <a href="/contact">Contact</a>
                </div>
        </nav>
    <header>
        <h1>Task Board</h1>
    </header>
    <main>
        <section>
           <a href="form.html" class="add-task">+ Add Task</a>
        </section>
        <section class="mytask">
            <h2>My Tasks</h2>
            <ul>
                <li>
                    <input type="checkbox" id="html">
                    <label>Learn HTML</label>
                    <span>High</span>
                    <button class="dlt-btn">Delete</button>
                </li>
                <li>
                    <input type="checkbox" id="git">
                    <label>Learn Git</label>
                    <span>Medium</span>
                    <button class="dlt-btn">Delete</button>
                </li>
                <li>
                    <input type="checkbox" id="evalution">
                    <label>Project evalution</label>
                    <span>Medium</span>
                    <button class="dlt-btn">Delete</button>
                </li>
                <li>
                    <input type="checkbox" id="task">
                    <label>Build Task</label>
                    <span>High</span>
                    <button class="dlt-btn">Delete</button>
                </li>
                <li>
                    <input type="checkbox" id="css">
                    <label>Learn css</label>
                    <span>Low</span>
                    <button class="dlt-btn">Delete</button>
                </li>
            </ul>
        </section>
        <section>
            <div class="stats-container">
                <div class="stat-card">
                    <span>5</span>
                    <p>Total tasks</p>
                </div>
                <div class="stat-card">
                    <span>2</span>
                    <p>Completed</p>
                </div>
                <div class="stat-card">
                    <span>3</span>
                    <p>High Priority</p>
                </div>
            </div>
        </section>
        <section >
            <div class="task-details">
                <h3>Learn HTML</h3>
                <div class="span-task">
                <span class="Completed">Completed</span>
                <span class="priority">High Priority</span>
                </div>
                <h4>Description</h4>
                <p>Learn about html tags and structure</p>
                <label>Due Date</label>
                <p>Friday</p>
            </div>
        </section>
        </main>
        <footer> Week 1 task at Cloudus infotech &copy; Copyright 2026 </footer>
    </body>
</html>
