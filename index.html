<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Task Board</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
    <header>
        <h1>Task Board</h1>
        <nav>
            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Tasks</li>
                <li>Contact</li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h2>My Tasks</h2>
            <ul>
                <li>
                    <input type="checkbox" id="html">
                    <label>Learn HTML</label>
                    <span>High</span>
                    <button class="dlt-btn">Delete</button>
                </li>
                <li>
                    <input type="checkbox" id="git">
                    <label>Learn Git</label>
                    <span>Medium</span>
                    <button class="dlt-btn">Delete</button>
                </li>
                <li>
                    <input type="checkbox" id="evalution">
                    <label>Project evalution</label>
                    <span>Medium</span>
                    <button class="dlt-btn">Delete</button>
                </li>
                <li>
                    <input type="checkbox" id="task">
                    <label>Build Task</label>
                    <span>High</span>
                    <button class="dlt-btn">Delete</button>
                </li>
                <li>
                    <input type="checkbox" id="css">
                    <label>Learn css</label>
                    <span>Low</span>
                    <button class="dlt-btn">Delete</button>
                </li>
            </ul>
        </section>
        <section>
            <div class="stats-container">
                <div class="stat-card">
                    <span>5</span>
                    <p>Total tasks</p>
                </div>
                <div class="stat-card">
                    <span>2</span>
                    <p>Completed</p>
                </div>
                <div class="stat-card">
                    <span>3</span>
                    <p>High Priority</p>
                </div>
            </div>
        </section>
        <section>
            <div>
                <title>Learn HTML</title>
                <span>Completed</span>
                <span>High Priority</span>
                <title>Description</title>
                <p>Learn about html tags and structure</p>
                <label>Due Date</label>
                <p>Friday</p>
            </div>
        </section>
        <section></section>
        </main>
        <footer>&copy; Copyright 2026 </footer>
    </body>
</html>
